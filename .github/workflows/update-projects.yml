name: Update featured projects

on:
  schedule: # execute every day
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated repo names to pin (leave empty to keep the current pin, 'auto' to clear it and go back to auto-pick by stars)"
        required: false
        default: ""
      count:
        description: "How many top-starred repos to show when 'repos' is empty"
        required: false
        default: "4"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Resolve pinned repos
        env:
          INPUT_REPOS: ${{ github.event.inputs.repos || '' }}
        run: |
          CONFIG=.github/featured-repos.txt
          touch "$CONFIG"

          if [ "$INPUT_REPOS" = "auto" ]; then
            : > "$CONFIG"
          elif [ -n "$INPUT_REPOS" ]; then
            echo "$INPUT_REPOS" > "$CONFIG"
          fi

          echo "REPOS=$(cat "$CONFIG")" >> "$GITHUB_ENV"

      - name: Commit pin change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/featured-repos.txt
          if ! git diff --cached --quiet; then
            git commit -m "🔖 chore: update pinned featured repos"
            git push
          fi

      - name: Fetch repo stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ github.event.inputs.count || '4' }}
        run: |
          cat > query.graphql <<'EOF'
          query($login: String!) {
            user(login: $login) {
              repositories(first: 100, ownerAffiliations: OWNER, isFork: false, orderBy: {field: STARGAZERS, direction: DESC}) {
                nodes {
                  name
                  url
                  description
                  isArchived
                  stargazerCount
                  forkCount
                  defaultBranchRef {
                    target {
                      ... on Commit {
                        committedDate
                        history { totalCount }
                        statusCheckRollup { state }
                      }
                    }
                  }
                }
              }
            }
          }
          EOF

          gh api graphql -F query=@query.graphql -f login="${{ github.repository_owner }}" > raw.json

          cat > select.jq <<'EOF'
          if (env.REPOS // "" | length) > 0 then
            (env.REPOS | split(",") | map(gsub("^\\s+|\\s+$";""))) as $names
            | [.data.user.repositories.nodes[] | select(.isArchived == false) | select(.name as $n | $names | index($n))]
          else
            [.data.user.repositories.nodes[] | select(.isArchived == false)] | .[:(env.COUNT | tonumber)]
          end
          EOF

          jq -f select.jq raw.json > top-repos.json

      - name: Render projects.svg
        run: |
          mkdir -p dist
          python3 .github/scripts/render_projects_svg.py top-repos.json > dist/projects.svg
          rm query.graphql raw.json select.jq top-repos.json

      - name: Push projects.svg to the output branch
        run: |
          git fetch origin output
          git worktree add /tmp/output-branch origin/output
          cp dist/projects.svg /tmp/output-branch/projects.svg
          cd /tmp/output-branch
          git add projects.svg
          git diff --cached --quiet || git commit -m "🔖 chore: refresh projects card"
          git push origin HEAD:output
          cd "$GITHUB_WORKSPACE"
          git worktree remove /tmp/output-branch --force
